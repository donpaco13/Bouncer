name: Landing (GitHub Pages)

# Déploie landing/out sous https://donpaco13.github.io/Bouncer/.
# Pré-requis, une seule fois, à la main : Settings > Pages > Source = « GitHub Actions ».

on:
  push:
    branches: [ main ]
    paths: [ "landing/**", ".github/workflows/landing-pages.yml" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      # NODE_ENV=production (posé par `next build`) active basePath=/Bouncer, voir next.config.ts.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: landing/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
